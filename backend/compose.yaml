name: karma-backend
services:
  api:
    build: .
    ports: ["127.0.0.1:${BACKEND_PORT:-8000}:8000"]
    environment:
      BACKEND_ENABLED: ${BACKEND_ENABLED:-false}
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DATABASE: karma
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-false}
      DEMO_TOKEN: ${DEMO_TOKEN:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      IFM_ENABLED: ${IFM_ENABLED:-false}
      IFM_API_KEY: ${IFM_API_KEY:-}
      ELEVENLABS_ENABLED: ${ELEVENLABS_ENABLED:-false}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes: ["mongo-data:/data/db"]
    # Deliberately no host port. Local-development network only, not production auth.
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { if (!rs.status().ok) quit(1); } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]}); quit(1); } if (!db.hello().isWritablePrimary) quit(1);'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  tests:
    build: .
    profiles: ["test"]
    environment:
      TEST_MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo-data:
